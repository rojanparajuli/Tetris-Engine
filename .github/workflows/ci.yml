name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    name: Test (Flutter ${{ matrix.flutter || 'stable' }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Oldest supported version (see pubspec.yaml) and latest stable.
        flutter: ['3.32.x', '']
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ matrix.flutter }}
          cache: true

      - run: flutter pub get

      - name: Check formatting
        if: matrix.flutter == ''
        run: dart format --output=none --set-exit-if-changed lib test example/lib example/test

      - run: flutter analyze

      - run: flutter test --coverage

      - name: Test example app
        working-directory: example
        run: flutter test

      # Newer Flutter tooling can rewrite checked-in files (e.g.
      # analysis_options.yaml) during the run. Show what changed, then restore
      # the committed files so the dry run validates exactly what gets published.
      - name: Validate package
        if: matrix.flutter == ''
        run: |
          git status --short
          git diff
          git checkout -- .
          flutter pub publish --dry-run
