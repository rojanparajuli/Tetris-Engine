name: tetris_engine
description: >-
  A complete, customizable Tetris engine for Flutter: Guideline rules (SRS,
  7-bag, hold, lock delay, T-Spins), themes, touch and keyboard controls,
  replays and save/restore.
version: 1.3.0
homepage: https://github.com/rojanparajuli/Tetris-Engine
repository: https://github.com/rojanparajuli/Tetris-Engine
issue_tracker: https://github.com/rojanparajuli/Tetris-Engine/issues

topics:
  - tetris
  - game
  - puzzle
  - game-engine
  - widget

screenshots:
  - description: Tetris game running with the dark theme.
    path: assets/ss.jpg

environment:
  sdk: ^3.8.0
  flutter: ">=3.32.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  fake_async: ^1.3.0
